# =============================================================================
# postgresql.conf — tuned baseline for the conjectures.io validator database
# -----------------------------------------------------------------------------
# Sized for the container limits in docker-compose.db.yml (4 vCPU, 8 GB). The
# stock defaults assume a tiny machine (128MB shared_buffers, no parallelism)
# and are the usual reason Postgres "feels slow". Scale with the formulas below
# if the host differs, and keep the compose `deploy.resources` limits at or
# above what these settings imply.
#
#   shared_buffers          = 25% of RAM
#   effective_cache_size    = 75% of RAM (a planner hint, not an allocation)
#   maintenance_work_mem    = ~5% of RAM, capped ~1GB
#   work_mem                = (RAM * 0.25) / max_connections / 2   (per sort/hash node)
# =============================================================================

# --- Connections -------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100            # API + workers + payout CLI. Add PgBouncer before
                                 # raising this; connections are expensive.
superuser_reserved_connections = 3

# --- Memory ------------------------------------------------------------------
shared_buffers = 2GB             # 25% of 8GB
effective_cache_size = 6GB       # 75% of 8GB
maintenance_work_mem = 512MB     # speeds up VACUUM, CREATE INDEX, ALTER TABLE
work_mem = 16MB                  # per sort/hash node, so the real total is a
                                 # multiple of this; keep modest.
huge_pages = try

# --- Write-Ahead Log / Checkpoints -------------------------------------------
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = on
synchronous_commit = on          # Never relax this. A payout row is committed
                                 # before its extrinsic is signed, so losing the
                                 # last few transactions means paying twice.

# --- Planner / storage assumptions (SSD) -------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallelism -------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
jit = on

# --- Autovacuum --------------------------------------------------------------
# submission_events and api_rejection_log are append-only and grow without
# bound, so the default 20% scale factor would let dead tuples from retention
# deletes accumulate for a long time before a vacuum triggers.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# --- Observability -----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_io_timing = on
track_activity_query_size = 4096
log_min_duration_statement = 1000   # anything slower than 1s
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0                  # every temp file means work_mem was too low
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# --- Misc --------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
