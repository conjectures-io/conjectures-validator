# Alembic configuration for the COMPETITION schema, which lives in its own database.
# The URL is resolved in env.py from competition_database_url(), never DATABASE_URL:
# Flyway owns the proofs database and Alembic owns this one, and the two must not meet.
[alembic]
# %(here)s is this file's own directory, so `alembic -c <path>` works from anywhere --
# the repo root, the migration image's /app, or a test's tmp dir. A bare relative path
# would resolve against the caller's cwd and find the tree only by luck.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../../..
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
