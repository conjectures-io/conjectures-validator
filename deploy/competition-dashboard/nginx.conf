# miniz-oxide standings dashboard (static page) on port 80, reading the platform API.
# The page calls /v1/competitions/... on this same origin; nginx forwards only GETs under
# that prefix to the API on 127.0.0.1:8000, so the browser needs no CORS and cannot submit.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/competition-dashboard;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /v1/competitions {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
