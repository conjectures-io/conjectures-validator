services:
  miner-load:
    profiles:
      - tools
    build:
      context: .
      dockerfile: docker/miner.Dockerfile
    image: frontier-math-miner:local
    init: true
    network_mode: none
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    environment:
      HOME: /home/miner
      XDG_STATE_HOME: /state
    volumes:
      - type: volume
        source: miner-state
        target: /state
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,uid=10001,gid=10001,mode=0700
    command:
      - --help
    ulimits:
      nofile:
        soft: 256
        hard: 256

  miner:
    build:
      context: .
      dockerfile: docker/miner.Dockerfile
    image: frontier-math-miner:local
    init: true
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    environment:
      HOME: /home/miner
      XDG_STATE_HOME: /state
    ports:
      - "${FRONTIER_MINER_LISTEN_IP:-127.0.0.1}:${FRONTIER_MINER_PORT:-8091}:8091"
    volumes:
      - type: bind
        source: ${FRONTIER_MINER_WALLET_DIR:-/var/empty/frontier-miner-wallets}
        target: /wallets
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: miner-state
        target: /state
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001,mode=0700
    command:
      - serve
      - --database
      - /state/frontier-math/miner.sqlite3
      - --network
      - ${BT_NETWORK:-finney}
      - --netuid
      - ${FRONTIER_NETUID:--1}
      - --wallet-name
      - ${FRONTIER_MINER_WALLET_NAME:-miner}
      - --hotkey
      - ${FRONTIER_MINER_HOTKEY:-default}
      - --wallet-path
      - /wallets
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --min-validator-tao
      - ${FRONTIER_MIN_VALIDATOR_TAO:-0}
      - --metagraph-refresh-seconds
      - ${FRONTIER_METAGRAPH_REFRESH_SECONDS:-30}
      - --requests-per-minute
      - ${FRONTIER_REQUESTS_PER_MINUTE:-60}
      - --max-concurrent-requests
      - ${FRONTIER_MAX_CONCURRENT_REQUESTS:-16}
      - --log-level
      - ${FRONTIER_MINER_LOG_LEVEL:-info}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 512
        hard: 512

volumes:
  miner-state:
