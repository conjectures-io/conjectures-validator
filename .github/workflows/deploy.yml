# Deploys `dev` to the dev server after every merge, and records what runs there in the tag
# `deployed/dev`. Production (`main`, behind an approval, with a GitHub Release per deploy) is the
# next phase; see docs/ci-cd/PLAN.md.
#
# The runner never gets a shell on the server. Its key reaches one forced command,
# deploy/ci/conjectures-deploy, which accepts a commit SHA and nothing else, refuses any commit
# that is not on origin/dev, and decides from the server's own config which services to touch.
# Setup for the server and for the `dev` environment in GitHub: deploy/ci/README.md.
#
# This repository is public, and so are these logs. Nothing here prints a secret, and the
# server script prints .env key names only, never values.

name: Deploy

on:
  push:
    branches: [dev]
  # Redeploy or roll back. Run it on the `dev` branch -- the `dev` environment accepts no other
  # ref: gh workflow run deploy.yml --ref dev -f sha=<commit on dev>
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on dev to deploy (empty: the tip of dev)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Inputs reach the script only through `env:`, and the SHA is checked before it is used or
      # written anywhere, so nothing typed into the dispatch form can become a command.
      - name: Resolve the commit
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/heads/dev ]] || { echo "::error::run this workflow on the dev branch"; exit 1; }
          if [[ "$EVENT" == push ]]; then
            sha="$GITHUB_SHA"
          elif [[ -n "$INPUT_SHA" ]]; then
            sha="$INPUT_SHA"
          else
            sha="$(git rev-parse origin/dev)"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/dev || { echo "::error::$sha is not on dev"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # What this deploy changes, compared with what the dev server runs now. Informational on
      # dev: nothing here stops the deploy. On production the same comparison gates it.
      - name: Summarise the change
        shell: bash
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          bullets() {   # one Markdown list item per non-empty line of $1
            local line
            while IFS= read -r line; do
              if [[ -n "$line" ]]; then printf -- "- \`%s\`\n" "$line"; fi
            done <<<"$1"
          }
          {
            echo "## Deploying \`${SHA:0:12}\` to the dev server"
            echo
            if git rev-parse -q --verify refs/tags/deployed/dev >/dev/null; then
              current="$(git rev-parse refs/tags/deployed/dev)"
              echo "Currently deployed: \`${current:0:12}\` (tag \`deployed/dev\`)."
              echo
              if git merge-base --is-ancestor "$current" "$SHA"; then
                echo "### Commits"
                echo
                git log --no-merges -n 100 --format='- %h %s' "$current..$SHA"
              else
                echo "**Rollback**: \`${SHA:0:12}\` is older than the deployed commit."
              fi
              migrations="$(git diff --name-only --diff-filter=A "$current" "$SHA" -- deploy/migrate/sql)"
              operator="$(git diff --name-only "$current" "$SHA" -- verifier verification_worker lean \
                Dockerfile docker-compose.yml docker-compose.db.yml deploy/worker deploy/db \
                lakefile.toml lean-toolchain lake-manifest.json)"
              env_keys="$(git diff "$current" "$SHA" -- .env.example | grep -oE '^\+[A-Z_][A-Z0-9_]*=' | tr -d '+=' || true)"
              if [[ -n "$migrations" ]]; then
                echo; echo "### New migrations (the server backs up the database first)"; echo
                bullets "$migrations"
              fi
              if [[ -n "$env_keys" ]]; then
                echo; echo "### Keys added to .env.example"; echo
                bullets "$env_keys"
                echo; echo "Add them to the \`DOTENV\` secret of the \`dev\` environment if the server needs them."
              fi
              if [[ -n "$operator" ]]; then
                echo; echo "### Paths that need an operator on production"; echo
                bullets "$operator"
              fi
            else
              echo "No \`deployed/dev\` tag yet: this is the first recorded deploy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${operator:-}" ]]; then
            echo "::warning::this change touches paths that production deploys only through an operator"
          fi

  deploy:
    name: deploy
    needs: [ci, plan]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: dev
      url: ${{ vars.DEPLOY_URL }}
    # One deploy at a time, and none cancelled halfway: a second merge waits for the first.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Deploy over the forced-command key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          # The whole .env for the server, pasted into the environment secret. Optional: when it
          # is not set, the server keeps the .env it has.
          DOTENV: ${{ secrets.DOTENV }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "::error::secret $name is not set on the dev environment"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh_deploy() {
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$@"
          }
          if [[ -n "$DOTENV" ]]; then
            printf '%s\n' "$DOTENV" | ssh_deploy "deploy-env $SHA $GITHUB_RUN_ID"
          else
            ssh_deploy "deploy $SHA $GITHUB_RUN_ID" < /dev/null
          fi

  record:
    name: record
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag is protected by .github/rulesets/deployed-tags.json: only the release GitHub App
      # may move it. Without RELEASE_APP_ID this falls back to GITHUB_TOKEN, which works only
      # while that ruleset is not active.
      - name: Token from the release GitHub App
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      # A moving tag: `git log -1 deployed/dev` answers "what runs on the dev server" without
      # logging in. The REST API rather than `git push`, so no checkout is needed.
      - name: Move deployed/dev
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/dev" \
               -f sha="$SHA" -F force=true 2>/dev/null; then
            echo "moved deployed/dev to $SHA"
          else
            gh api --silent -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/deployed/dev -f sha="$SHA"
            echo "created deployed/dev at $SHA"
          fi
          echo "Tagged \`deployed/dev\` → \`${SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
