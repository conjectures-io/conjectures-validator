# Deploys after every merge: `dev` to the dev server, `main` to production.
#
#   dev         automatic. Moves the tag `deployed/dev`.
#   production  waits for an approval in the `production` environment. Moves `deployed/production`
#               and publishes a GitHub Release with generated notes (its `release` job).
#               A change that touches operator paths (the verifier, the worker, Lean, the
#               database stack) is not deployed automatically: an operator does the manual steps,
#               then dispatches this workflow with operator_steps_done.
#
# The runner never gets a shell on a server. Its key reaches one forced command,
# deploy/ci/conjectures-deploy, which accepts a commit SHA and nothing else, refuses any commit
# that is not on the server's branch, and decides from the server's own config which services to
# touch. Setup for the servers and the GitHub environments: deploy/ci/README.md.
#
# This repository is public, and so are these logs. Nothing here prints a secret, and the
# server script prints .env key names only, never values.

name: Deploy

on:
  push:
    branches: [dev, main]
  # Redeploy, roll back, or deploy a change after its operator steps. Run it on the branch the
  # environment deploys from -- each environment accepts no other ref:
  #   gh workflow run deploy.yml --ref dev  -f environment=dev -f ref=<commit on dev>
  #   gh workflow run deploy.yml --ref main -f environment=production -f ref=<commit on main | vYYYY.MM.DD>
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [dev, production]
        default: dev
      ref:
        description: "Commit SHA on the branch (empty: its tip). Production also takes a release tag, to roll back."
        required: false
        default: ""
      operator_steps_done:
        description: "Production: the operator steps listed in the plan summary are done"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Was this exact content already tested? Two kinds of run can vouch for a push, and any doubt,
  # including an API error, means CI runs:
  #
  #   1. The merge queue (dev): a successful ci.yml merge_group run on exactly the pushed commit.
  #      The queue tests the PR merged onto the branch's current tip and then lands that very
  #      commit, so the run tested the bytes being deployed -- the strongest evidence there is.
  #   2. A PR merged without the queue: a successful ci.yml pull_request run on the head of the
  #      PR whose merge commit *is* the pushed commit, whose `record tested tree` artifact names
  #      the pushed commit's tree. The tree matches when the base did not move between the PR's
  #      checks and its merge. A PR runs its own copy of ci.yml, so a run on any other PR -- or a
  #      fork's -- proves nothing; the PR that produced this merge had its ci.yml reviewed with
  #      the rest of its diff.
  #
  # Both runs must come from this repository. A direct push has neither.
  tested:
    name: already tested?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run_ci: ${{ steps.lookup.outputs.run_ci }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Look for a green run that tested this commit
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          finish() {   # $1 = run_ci, $2 = summary line
            if [[ "$1" == false ]]; then echo "CI skipped: $2" >> "$GITHUB_STEP_SUMMARY"
            else echo "$2: running CI." >> "$GITHUB_STEP_SUMMARY"; fi
            echo "run_ci=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # 1. The merge queue tested exactly this commit.
          queue_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success&per_page=20" \
                         --jq ".workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .conclusion == \"success\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\") | .html_url" \
                         2>/dev/null | head -n 1)" || queue_run=""
          if [[ -n "$queue_run" ]]; then
            finish false "the merge queue tested exactly \`${GITHUB_SHA:0:12}\` in $queue_run"
          fi

          # 2. The PR that produced this merge tested the same tree.
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                       --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\") | .head.sha" \
                       2>/dev/null | head -n 1)" || pr_head=""
          [[ "$pr_head" =~ ^[0-9a-f]{40}$ ]] \
            || finish true "No merge-queue run on \`${GITHUB_SHA:0:12}\`, and no merged PR has it as its merge commit (a direct push, or the API did not answer)"
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree&per_page=30" \
                   --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' 2>/dev/null)" \
            || { echo "::warning::could not list artifacts"; ids=""; }
          for id in $ids; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
                      --jq '[.path, .event, .conclusion, .head_repository.full_name, .head_sha, .html_url] | @tsv' 2>/dev/null)" || continue
            IFS=$'\t' read -r path event conclusion repo head url <<<"$info"
            if [[ "$path" == .github/workflows/ci.yml && "$event" == pull_request && "$conclusion" == success \
                  && "$repo" == "$GITHUB_REPOSITORY" && "$head" == "$pr_head" ]]; then
              finish false "tree \`$tree\` passed every gate in $url, on the head of the PR merged as \`${GITHUB_SHA:0:12}\`"
            fi
          done
          finish true "No green run on the merged PR's head tested tree \`$tree\` (the base moved after the PR's checks, or they never finished)"

  ci:
    name: CI
    needs: [tested]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.tested.outputs.run_ci != 'false'
    uses: ./.github/workflows/ci.yml

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      sha: ${{ steps.target.outputs.sha }}
      rollback_tag: ${{ steps.target.outputs.rollback_tag }}
      scope: ${{ steps.scope.outputs.scope }}
      gated: ${{ steps.scope.outputs.gated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Inputs reach the script only through `env:`, and each is checked against an exact shape
      # before it is used or written anywhere, so nothing typed into the dispatch form can become
      # a command.
      - name: Resolve the environment and the commit
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet origin
          if [[ "$EVENT" == push ]]; then
            case "$REF" in
              refs/heads/dev)  environment=dev ;;
              refs/heads/main) environment=production ;;
              *) echo "::error::no environment deploys from $REF"; exit 1 ;;
            esac
          else
            environment="$INPUT_ENVIRONMENT"
          fi
          case "$environment" in
            dev)        branch=dev ;;
            production) branch=main ;;
            *) echo "::error::unknown environment $environment"; exit 1 ;;
          esac
          [[ "$REF" == "refs/heads/$branch" ]] \
            || { echo "::error::run this workflow on the $branch branch to deploy $environment"; exit 1; }

          rollback_tag=""
          if [[ "$EVENT" == push ]]; then
            sha="$GITHUB_SHA"
          elif [[ -z "$INPUT_REF" ]]; then
            sha="$(git rev-parse "origin/$branch")"
          elif [[ "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$INPUT_REF"
          elif [[ "$environment" == production && "$INPUT_REF" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            git rev-parse -q --verify "refs/tags/$INPUT_REF" >/dev/null \
              || { echo "::error::no release tag $INPUT_REF"; exit 1; }
            sha="$(git rev-list -n 1 "refs/tags/$INPUT_REF")"
            rollback_tag="$INPUT_REF"
          else
            echo "::error::ref must be empty, a 40-character commit SHA, or (production) a release tag vYYYY.MM.DD[.N]"
            exit 1
          fi
          git merge-base --is-ancestor "$sha" "origin/$branch" || { echo "::error::$sha is not on $branch"; exit 1; }
          {
            echo "environment=$environment"
            echo "sha=$sha"
            echo "rollback_tag=$rollback_tag"
          } >> "$GITHUB_OUTPUT"

      # What this deploy changes, compared with what the environment runs now (its deployed/* tag).
      #   app        nothing below: deploys
      #   migration  new migrations: deploys; the server backs up the database first
      #   operator   operator paths changed: production waits for operator_steps_done
      #   first      no deployed/* tag yet, nothing to compare with: production waits too
      # On dev the scope is informational; nothing there stops the deploy.
      - name: Work out the deploy scope
        id: scope
        shell: bash
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          SHA: ${{ steps.target.outputs.sha }}
          ROLLBACK_TAG: ${{ steps.target.outputs.rollback_tag }}
          OPERATOR_STEPS_DONE: ${{ inputs.operator_steps_done || false }}
        run: |
          set -euo pipefail
          bullets() {   # one Markdown list item per non-empty line of $1
            local line
            while IFS= read -r line; do
              if [[ -n "$line" ]]; then printf -- "- \`%s\`\n" "$line"; fi
            done <<<"$1"
          }
          tag="deployed/$ENVIRONMENT"
          migrations=""; operator=""; env_keys=""
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            current="$(git rev-parse "refs/tags/$tag")"
            migrations="$(git diff --name-only --diff-filter=A "$current" "$SHA" -- deploy/migrate/sql)"
            operator="$(git diff --name-only "$current" "$SHA" -- verifier verification_worker lean \
              Dockerfile docker-compose.yml docker-compose.db.yml deploy/worker deploy/db \
              lakefile.toml lean-toolchain lake-manifest.json)"
            env_keys="$(git diff "$current" "$SHA" -- .env.example | grep -oE '^\+[A-Z_][A-Z0-9_]*=' | tr -d '+=' || true)"
            if [[ -n "$operator" ]]; then scope=operator
            elif [[ -n "$migrations" ]]; then scope=migration
            else scope=app; fi
          else
            current=""; scope=first
          fi
          gated=false
          if [[ "$ENVIRONMENT" == production && ( "$scope" == operator || "$scope" == first ) \
                && "$OPERATOR_STEPS_DONE" != true ]]; then
            gated=true
          fi
          { echo "scope=$scope"; echo "gated=$gated"; } >> "$GITHUB_OUTPUT"

          {
            echo "## Deploying \`${SHA:0:12}\` to $ENVIRONMENT"
            echo
            echo "**Scope: \`$scope\`**"
            [[ -z "$ROLLBACK_TAG" ]] || echo "Rolling back to release \`$ROLLBACK_TAG\`."
            echo
            if [[ -n "$current" ]]; then
              echo "Currently deployed: \`${current:0:12}\` (tag \`$tag\`)."
              echo
              if git merge-base --is-ancestor "$current" "$SHA"; then
                echo "### Commits"
                echo
                git log --no-merges -n 100 --format='- %h %s' "$current..$SHA"
              else
                echo "**Rollback**: \`${SHA:0:12}\` is older than the deployed commit."
              fi
            else
              echo "No \`$tag\` tag yet: this is the first recorded deploy, so there is nothing to compare with."
            fi
            if [[ -n "$migrations" ]]; then
              echo; echo "### New migrations (the server backs up the database first)"; echo
              bullets "$migrations"
            fi
            if [[ -n "$env_keys" ]]; then
              echo; echo "### Keys added to .env.example"; echo
              bullets "$env_keys"
              echo; echo "Add them to the \`DOTENV\` secret of the \`$ENVIRONMENT\` environment if the server needs them."
            fi
            if [[ -n "$operator" ]]; then
              echo; echo "### Operator paths"; echo
              bullets "$operator"
            fi
            if [[ "$gated" == true ]]; then
              echo
              echo "### Not deployed: an operator goes first"
              echo
              echo "Production deploys a \`$scope\` change only after an operator has done the manual"
              echo "steps (see the PR's \"Operator steps\" and docs/DEPLOYING.md, \"Operator changes\")."
              echo "Then:"
              echo
              echo '```'
              echo "gh workflow run deploy.yml --ref main -f environment=production -f ref=$SHA -f operator_steps_done=true"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$gated" == true ]]; then
            echo "::warning title=Not deployed::$scope change: production waits for the operator steps, then a dispatch with operator_steps_done (see the summary)"
          elif [[ -n "$operator" ]]; then
            echo "::warning::this change touches paths that production deploys only through an operator"
          fi

  # CI either passed here, or was skipped for one of exactly two reasons: a manual run (a commit
  # already on the branch, or a release tag), or `tested` found a green PR run on this tree.
  deploy:
    name: deploy
    needs: [tested, ci, plan]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.gated != 'true' &&
      (needs.ci.result == 'success' ||
       (needs.ci.result == 'skipped' &&
        (github.event_name == 'workflow_dispatch' || needs.tested.outputs.run_ci == 'false')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # production: required reviewers approve here, before the job (and its secrets) starts.
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    # One deploy at a time per environment, and none cancelled halfway.
    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Deploy over the forced-command key
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          # The whole .env for the server, pasted into the environment secret. Optional: when it
          # is not set, the server keeps the .env it has.
          DOTENV: ${{ secrets.DOTENV }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "::error::secret $name is not set on the $ENVIRONMENT environment"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh_deploy() {
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$@"
          }
          if [[ -n "$DOTENV" ]]; then
            printf '%s\n' "$DOTENV" | ssh_deploy "deploy-env $SHA $GITHUB_RUN_ID"
          else
            ssh_deploy "deploy $SHA $GITHUB_RUN_ID" < /dev/null
          fi

  # `!cancelled()` and an explicit check of `deploy`, not the implicit success(): that one fails
  # whenever any job upstream was skipped -- and `ci` is skipped on every manual run and whenever
  # `tested` finds a green PR run -- so the tag would not move after a successful deploy.
  record-dev:
    name: record
    needs: [plan, deploy]
    if: >-
      !cancelled() && needs.deploy.result == 'success' && needs.plan.outputs.environment == 'dev'
    runs-on: ubuntu-latest
    # The release App's private key is a secret of the `release` environment, which only `dev` and
    # `main` may use: a workflow pushed to any other branch cannot read it.
    environment: release
    permissions:
      contents: write
    steps:
      # The tag is protected by .github/rulesets/deployed-tags.json: only the release GitHub App
      # may move it. Without RELEASE_APP_ID this falls back to GITHUB_TOKEN, which works only
      # while that ruleset is not active.
      - name: Token from the release GitHub App
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      # A moving tag: `git log -1 deployed/dev` answers "what runs on the dev server" without
      # logging in. The REST API rather than `git push`, so no checkout is needed.
      - name: Move deployed/dev
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/dev" \
               -f sha="$SHA" -F force=true 2>/dev/null; then
            echo "moved deployed/dev to $SHA"
          else
            gh api --silent -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/deployed/dev -f sha="$SHA"
            echo "created deployed/dev at $SHA"
          fi
          echo "Tagged \`deployed/dev\` → \`${SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"

  # Moves deployed/production and publishes the release (or, after a rollback, marks the release
  # returned to as Latest). An ordinary job, like `record` above, and deliberately not a reusable
  # workflow: a called workflow's job did not receive the `release` environment's secret, so the
  # first production deploy succeeded and then could not record itself.
  record-production:
    name: release
    needs: [plan, deploy]
    if: >-
      !cancelled() && needs.deploy.result == 'success' &&
      needs.plan.outputs.environment == 'production'
    runs-on: ubuntu-latest
    # The release App's private key is a secret of the `release` environment, which only `dev` and
    # `main` may use: a workflow pushed to any other branch cannot read it.
    environment: release
    permissions:
      contents: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - name: Token from the release GitHub App
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      # The commit and the rollback tag were resolved and checked by `plan`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the release tags
        shell: bash
        run: git fetch --tags --force --quiet origin

      - name: Move deployed/production
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/deployed/production" \
               -f sha="$SHA" -F force=true 2>/dev/null; then
            echo "moved deployed/production to $SHA"
          else
            gh api --silent -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/deployed/production -f sha="$SHA"
            echo "created deployed/production at $SHA"
          fi

      # A rollback publishes nothing new: the release it returned to becomes "Latest" again, so
      # the next release's notes start from what was actually running.
      - name: Mark the release returned to as Latest
        if: needs.plan.outputs.rollback_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          TAG: ${{ needs.plan.outputs.rollback_tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --latest
          echo "Rolled back: \`$TAG\` is Latest again, \`deployed/production\` points to it." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release with generated notes
        if: needs.plan.outputs.rollback_tag == ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The commit may already be a release (the workflow re-run, or dispatched twice).
          existing="$(git tag --points-at "$SHA" --list 'v*' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh release edit "$existing" --latest
            echo "\`${SHA:0:12}\` is already release \`$existing\`; marked it Latest." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="v$(date -u +%Y.%m.%d)"; tag="$base"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do n=$((n + 1)); tag="$base.$n"; done
          # Notes run from the release marked Latest, which is the one production ran until now.
          args=(--target "$SHA" --title "$tag" --generate-notes --latest)
          if previous="$(gh release view --json tagName --jq .tagName 2>/dev/null)" && [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$tag" "${args[@]}"
          migrations=""
          if [[ -n "${previous:-}" ]]; then
            migrations="$(git diff --name-only --diff-filter=A "refs/tags/$previous" "$SHA" -- deploy/migrate/sql)"
          fi
          {
            gh release view "$tag" --json body --jq .body
            echo
            echo "---"
            if [[ -n "$migrations" ]]; then
              echo "**Migrations in this release:**"
              while IFS= read -r file; do echo "- \`$file\`"; done <<<"$migrations"
              echo
            fi
            echo "Deployed commit \`$SHA\`, recorded by $RUN_URL"
          } > notes.md
          gh release edit "$tag" --notes-file notes.md
          echo "Published [\`$tag\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag) for \`${SHA:0:12}\`." >> "$GITHUB_STEP_SUMMARY"
