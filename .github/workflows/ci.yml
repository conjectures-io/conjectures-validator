# The first CI this repository has had. Three gates, in increasing cost: lint, the
# self-contained test suite, and the schema-drift proof.
#
# The drift job is the one that is easy to undervalue. `deploy/migrate/sql/` is the source of
# truth for the schema and `conjectures_subnet/db/models.py` is a hand-maintained mirror of it,
# with no tool diffing plain SQL against ORM metadata. Every migration is therefore two edits
# that a reviewer has to keep in step by eye. `scripts/check_schema_drift.py` is the only thing
# that proves they are, so it runs on every pull request rather than on request.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push should not leave the previous run burning CI minutes on a commit nobody will
# merge. `main` is excluded from cancellation: its runs are the record of what was released.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Single-sourced so the three jobs cannot drift onto different interpreters. The package
  # supports >=3.11,<3.14; this is the version the development environments run.
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pinned. Ruff's default rule set has widened between releases, so an unpinned install
      # turns an upstream release into a red build on rules nobody selected. The selected
      # rules themselves live in pyproject.toml.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.4

      - name: Lint
        run: ruff check .

      # Reports formatting differences without failing: the repository has never been
      # ruff-formatted, so gating on it would mean reformatting every file in one commit and
      # losing the blame. Left visible so the decision to adopt it can be taken on evidence.
      - name: Formatting (advisory)
        continue-on-error: true
        run: ruff format --check --diff .

  test:
    name: pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        # Plain image on purpose. The tuned config and the `monitor` role in deploy/db/ are
        # production concerns; no migration and no test needs an extension or a role, so the
        # stock image is the smallest thing that runs the suite honestly.
        image: postgres:17
        env:
          POSTGRES_USER: conjectures-pytest
          POSTGRES_PASSWORD: conjectures-pytest-pw
          POSTGRES_DB: conjectures-pytest
        ports:
          # Container port only, so Docker maps it to a free host port for this job. The test
          # guard (tests/database_guard.py) refuses TCP 5432 and 5440 -- production and the
          # shared pytest stack -- so the suite may not run on either, even here.
          - 5432
        options: >-
          --health-cmd "pg_isready -U conjectures-pytest -d conjectures-pytest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Deliberately no database variables at job level. "Capture the service's cluster identity"
    # exports them through GITHUB_ENV once the port and identity are known, so no step can reach
    # a server before tests/database_guard.py has proved which one it is.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-service.lock

      # The same command scripts/bootstrap.sh uses, minus the Lean half of that script: these
      # tests need the Python packages, not the toolchain. `pip check` is kept because the
      # constraint file is maintained by hand and a conflicting pin should fail here.
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install \
            --constraint requirements-service.lock \
            -e '.[dev,service,subnet,db,competition]'
          python -m pip check

      # The suite skips its database tests when no DSN is set, which is right on a laptop and
      # dangerous here: unset, this job would pass having exercised almost nothing. The guard also
      # accepts a DSN only together with the identity of the cluster it must reach. That identity
      # is read here out of band -- from this job's own service container, over its local socket,
      # in a read-only transaction -- never from the DSN it is about to vouch for.
      #
      # Expressions reach the script only through `env:`, and every value is checked before it
      # is used or written to GITHUB_ENV: a container id is hex, a port and an identity are
      # digits, so no value can carry a newline into the env file.
      - name: Capture the service's cluster identity
        shell: bash
        env:
          SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
          PGPASSWORD: conjectures-pytest-pw
        run: |
          set -euo pipefail
          if [[ ! "$SERVICE_CONTAINER" =~ ^[0-9a-f]{12,64}$ ]]; then
            echo "the postgres service has no usable container id" >&2
            exit 1
          fi
          if [[ ! "$SERVICE_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( SERVICE_PORT > 65535 )); then
            echo "the postgres service's mapped host port is not a TCP port number" >&2
            exit 1
          fi
          if (( SERVICE_PORT == 5432 || SERVICE_PORT == 5440 )); then
            echo "the postgres service was mapped to TCP $SERVICE_PORT, which the guard refuses" >&2
            exit 1
          fi
          # The same expression the guard compares against (database_guard.IDENTITY_SQL).
          identity="$(
            docker exec --env PGPASSWORD --env 'PGOPTIONS=-c default_transaction_read_only=on' \
              "$SERVICE_CONTAINER" \
              psql -X -v ON_ERROR_STOP=1 -U conjectures-pytest -d conjectures-pytest -tAc \
              'SELECT system_identifier::text FROM pg_control_system()'
          )"
          if [[ ! "$identity" =~ ^-?[0-9]{1,20}$ ]]; then
            echo "the postgres service did not report a cluster system_identifier" >&2
            exit 1
          fi
          base="postgresql+psycopg://conjectures-pytest:conjectures-pytest-pw@127.0.0.1:$SERVICE_PORT"
          {
            printf 'FC_TEST_DATABASE_SYSTEM_IDENTIFIER=%s\n' "$identity"
            printf 'FC_POSTGRES_DSN=%s/conjectures-pytest\n' "$base"
            # The competition schema lives in a second database in the SAME server, as it does
            # in the deployment. Created below: a `services:` container takes one POSTGRES_DB.
            printf 'FC_COMPETITION_POSTGRES_DSN=%s/conjectures-pytest-competition\n' "$base"
          } >> "$GITHUB_ENV"
          echo "service cluster $identity on 127.0.0.1:$SERVICE_PORT"

      # Before anything creates, migrates or drops: the harness's own guard proves the proofs DSN
      # reaches the cluster just identified, and the expected database on it. A refused port, an
      # unreachable server or another identity raises DatabaseGuardError and stops the job here.
      - name: Verify the proofs database with the test guard
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import database_guard as guard
          from conftest_api import postgres_dsn  # the entry point the tests themselves use

          reached = []

          def probe(dsn):
              database, identifier = guard._probe(dsn)
              reached.append(database)
              return database, identifier

          if guard.verified_dsn("FC_POSTGRES_DSN", probe=probe) is None or postgres_dsn() is None:
              sys.exit("FC_POSTGRES_DSN is not set, so every database test would skip")
          if reached != ["conjectures-pytest"]:
              sys.exit(f"FC_POSTGRES_DSN reaches {reached}, not conjectures-pytest")
          print("verified proofs database:", postgres_dsn().rsplit("@", 1)[-1])
          PY

      # deploy/db/01_competition.sh does this in a real deployment; a `services:` container
      # runs no init script, so it is done here instead -- inside this job's own service
      # container, and only after checking it is still the cluster the guard just verified, so
      # the CREATE cannot land on any other server. Idempotent for the same reason the script is.
      - name: Create the competition database
        shell: bash
        env:
          SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: conjectures-pytest-pw
        run: |
          set -euo pipefail
          if [[ ! "$SERVICE_CONTAINER" =~ ^[0-9a-f]{12,64}$ ]]; then
            echo "the postgres service has no usable container id" >&2
            exit 1
          fi
          identity="$(
            docker exec --env PGPASSWORD --env 'PGOPTIONS=-c default_transaction_read_only=on' \
              "$SERVICE_CONTAINER" \
              psql -X -v ON_ERROR_STOP=1 -U conjectures-pytest -d conjectures-pytest -tAc \
              'SELECT system_identifier::text FROM pg_control_system()'
          )"
          expected="${FC_TEST_DATABASE_SYSTEM_IDENTIFIER:-}"
          if [[ -z "$expected" || "$identity" != "$expected" ]]; then
            echo "the service container is not the cluster the guard verified" >&2
            exit 1
          fi
          service_psql() {
            docker exec -i --env PGPASSWORD "$SERVICE_CONTAINER" \
              psql -X -v ON_ERROR_STOP=1 -U conjectures-pytest -d conjectures-pytest "$@"
          }
          service_psql -tAc \
            "SELECT 'CREATE DATABASE \"conjectures-pytest-competition\"'
             WHERE NOT EXISTS (
               SELECT FROM pg_database WHERE datname = 'conjectures-pytest-competition')" \
          | service_psql

      # The new database must be on that same verified cluster before Alembic writes to it.
      - name: Verify the competition database with the test guard
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import database_guard as guard
          from conftest import competition_dsn  # the entry point the tests themselves use

          reached = []

          def probe(dsn):
              database, identifier = guard._probe(dsn)
              reached.append(database)
              return database, identifier

          verified = guard.verified_dsn("FC_COMPETITION_POSTGRES_DSN", probe=probe)
          if verified is None or competition_dsn() is None:
              sys.exit("FC_COMPETITION_POSTGRES_DSN is not set, so the competition tests would skip")
          if reached != ["conjectures-pytest-competition"]:
              sys.exit(f"FC_COMPETITION_POSTGRES_DSN reaches {reached}, not conjectures-pytest-competition")
          print("verified competition database:", competition_dsn().rsplit("@", 1)[-1])
          PY

      # docker-compose.pytest-db.yml's migrate-competition service does this locally. The API
      # and worker tests clear these tables rather than build them, so an unmigrated database
      # fails every one of them with UndefinedTable. The URL comes from the shell, not an
      # expression, and an empty one stops here: `competition_database_url()` would otherwise
      # fall back to localhost:5432.
      - name: Migrate the competition database
        shell: bash
        run: |
          COMPETITION_DATABASE_URL="${FC_COMPETITION_POSTGRES_DSN:?the competition DSN was not verified}" \
            alembic -c deploy/migrate/competition/alembic.ini upgrade head

      # Three markers, for three inputs this job does not provision: the pinned Lean toolchain
      # and trusted cache, a local Subtensor chain, and the task-bundle plus vendored checkouts.
      #
      # Deselected by marker rather than by ignoring whole files, because the dependency is
      # per-test: 26 tests need a checkout, and the files holding them contain 62 that do not.
      # `test_verification_worker.py` alone is 41 self-contained tests behind 2 that are not.
      # Ignoring files would have dropped all 62.
      #
      # To regenerate the marked set, reproduce this environment locally -- a bare clone has no
      # vendor/, no .lake/ and no sibling conjectures-tasks, which is exactly what CI sees:
      #
      #   git clone --shared . /tmp/bare/conjectures-validator && cd /tmp/bare/conjectures-validator
      #   PYTHONPATH=$PWD pytest -m "not integration and not subnet_integration"
      #
      # Anything that fails there needs `needs_checkouts` and does not have it.
      - name: Test
        run: |
          pytest -q -m "not integration and not subnet_integration and not needs_checkouts"

  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: drift-pw
          POSTGRES_DB: postgres
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U drift -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-service.lock

      # Only the database extra: this script applies the migrations and calls create_all, and
      # imports no part of the API.
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --constraint requirements-service.lock -e '.[db]'

      # Creates two scratch databases on this server, applies deploy/migrate/sql to one and
      # Base.metadata.create_all to the other, compares the catalogs, and drops both. It needs
      # CREATE DATABASE, which is why it connects as the superuser to `postgres`.
      - name: Compare the migrations against the ORM mirror
        run: |
          python scripts/check_schema_drift.py \
            --dsn postgresql://drift:drift-pw@127.0.0.1:5441/postgres
