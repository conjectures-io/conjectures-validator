# Epoch weight setter overlay. Pass this after docker-compose.api.yml so it joins the same
# Compose project, while remaining deliberately independent from the database and API.

services:
  emissions:
    build:
      context: .
      dockerfile: Dockerfile.emissions
    image: conjectures-emissions-worker:local
    container_name: conjectures_emissions
    init: true
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    restart: unless-stopped

    env_file: .env
    environment:
      EMISSIONS_NETWORK: ${EMISSIONS_NETWORK:-finney}
      EMISSIONS_WALLET_NAME: ${EMISSIONS_WALLET_NAME:?set the validator wallet name in .env}
      EMISSIONS_WALLET_HOTKEY: ${EMISSIONS_WALLET_HOTKEY:?set the validator hotkey name in .env}
      EMISSIONS_WALLET_PATH: /wallets
      EMISSIONS_RETRY_SECONDS: ${EMISSIONS_RETRY_SECONDS:-30}
      HOME: /tmp

      # --- Competition weights ----------------------------------------------
      # Read over HTTP from the platform's own API, deliberately: this container
      # holds the only key on the subnet that can set weights, and has no
      # database credential at all. Giving it one to save a call would trade a
      # real isolation property for a convenience.
      #
      # Unset means no competition is paid and the treasury takes everything,
      # which is exactly what this worker did before competitions existed.
      # Every failure -- unreachable, malformed, or older than the max age --
      # resolves to that same vector rather than to a skipped epoch, because an
      # epoch's emissions cannot be set retroactively.
      EMISSIONS_COMPETITION_WEIGHTS_URL: ${EMISSIONS_COMPETITION_WEIGHTS_URL:-}
      EMISSIONS_COMPETITION_SLUG: ${EMISSIONS_COMPETITION_SLUG:-lz77}
      EMISSIONS_COMPETITION_TOKEN: ${EMISSIONS_COMPETITION_TOKEN:-}
      EMISSIONS_VECTOR_MAX_AGE_SECONDS: ${EMISSIONS_VECTOR_MAX_AGE_SECONDS:-1200}

      # --- Observability ----------------------------------------------------
      # Optional: unset means the sink is a no-op and stderr logging is
      # unchanged. Same variables in every service, so all four cannot end up
      # writing to different datasets.
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_ENVIRON: ${AXIOM_ENVIRON:-compose}
      AXIOM_LOG_LEVEL: ${AXIOM_LOG_LEVEL:-INFO}

    volumes:
      - ./emissions_worker:/srv/app/emissions_worker:ro
      # Mount one wallet only. The hotkey signs SetWeights; no service besides this one receives it.
      - ${EMISSIONS_WALLET_HOST_PATH:?set the host wallet root in .env}/${EMISSIONS_WALLET_NAME:?set the validator wallet name in .env}:/wallets/${EMISSIONS_WALLET_NAME}:ro

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 128
