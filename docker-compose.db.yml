# Durable database stack: Postgres plus a one-shot Flyway migration service.
#
#   docker compose -f docker-compose.db.yml up -d
#
# brings up the database, waits for it to be healthy, applies every pending
# migration in deploy/migrate/sql, and exits. Re-running applies nothing and
# exits 0 — Flyway records what it has already run in flyway_schema_history.
#
# Named docker-compose.db.yml, not compose.yaml, on purpose: this repo's
# docker-compose.yml is the hostile-proof verifier sandbox, and Compose gives
# compose.yaml precedence over it, so a bare `docker compose up` would silently
# stop meaning what it means today.

name: conjectures-db

services:
  db:
    image: postgres:17
    container_name: conjectures_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    # Run with the tuned config instead of the stock one.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      # Loopback only. The database is reachable from other compose services by
      # hostname; exposing it on 0.0.0.0 would put payment data on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted as a single file so the path resolves to a real file rather than
      # an empty bind-created directory, which is what makes config_file= fail
      # and the container come up unhealthy.
      - ./deploy/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Runs once, on an empty data dir, as the superuser.
      - ./deploy/db/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    # Postgres uses /dev/shm for parallel workers and large hash/sort spills.
    # Docker's 64MB default causes "could not resize shared memory segment".
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # One-shot: applies pending migrations, then exits. No Dockerfile — the
  # migrations are plain SQL, so the official image plus a read-only bind mount
  # is the whole runner.
  migrate:
    image: flyway/flyway:11-alpine
    container_name: conjectures_migrate
    env_file: .env
    environment:
      # JDBC URL, not a libpq one. The password is passed separately, so it
      # never appears in the connection string in logs.
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # Refuse to adopt a database that already has objects but no history
      # table. Without this, pointing at an existing database would mark V001 as
      # applied without running it and every later migration would build on
      # unknown ground.
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      # The checksum guard: an already-applied migration that has been edited
      # aborts the run instead of leaving two environments quietly different.
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      # `flyway clean` drops every object in the schema. Never reachable here.
      FLYWAY_CLEAN_DISABLED: "true"
      # The database sets statement_timeout=60s for application queries; a real
      # index build is legitimately slower than that.
      FLYWAY_INIT_SQL: "SET statement_timeout = 0"
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./deploy/migrate/sql:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

volumes:
  pgdata:
