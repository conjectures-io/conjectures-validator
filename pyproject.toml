[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "formal-conjectures-verifier"
version = "0.1.0"
description = "Pinned full-repository Lean proof verification proof of concept"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5"]

[project.scripts]
fc-verifier = "verifier.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: requires the pinned Lean toolchain and trusted cache"]

[tool.hatch.build.targets.wheel]
packages = ["verifier"]
