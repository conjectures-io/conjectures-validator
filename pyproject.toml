[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "formal-conjectures-verifier"
version = "0.1.0"
description = "Paid Lean-proof validator for conjectures.io Bittensor Subnet 66"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5"]
service = [
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
]
subnet = ["bittensor==11.0.0"]

[project.scripts]
fc-verifier = "verifier.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires the pinned Lean toolchain and trusted cache",
    "subnet_integration: requires the pinned local Subtensor chain",
]

[tool.hatch.build.targets.wheel]
packages = ["verifier", "conjectures_subnet"]
