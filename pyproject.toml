[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "formal-conjectures-verifier"
version = "0.1.0"
description = "Paid Lean-proof validator for conjectures.io Bittensor Subnet 66"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# httpx2 is for starlette's TestClient, not for our code: starlette 1.x prefers it and falls
# back to httpx with a deprecation warning. Only tests/test_api_observability.py uses that
# client — every other API test drives the app through httpx.ASGITransport directly — so this
# belongs here rather than in `service`, which never constructs a TestClient.
dev = ["pytest>=8.2", "pytest-cov>=5", "httpx2>=2.10"]
service = [
    "formal-conjectures-verifier[db,subnet]",
    "fastapi==0.139.2",
    "google-auth==2.56.3",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    # Pinned even though fastapi already requires it, because fastapi asks only for
    # `starlette>=0.46.0` with no upper bound. Left to resolve itself it crossed into 1.x on its
    # own and changed the test client's HTTP backend; a major version of the thing FastAPI is
    # built on should be a deliberate bump, not something a fresh `uv sync` decides.
    "starlette==1.3.1",
    "uvicorn==0.51.0",
]
subnet = ["bittensor==11.0.0"]
# Database access only. Migrations are plain SQL applied by Flyway
# (deploy/migrate/sql), so no migration tool belongs in this extra.
# greenlet is explicit rather than left to SQLAlchemy's platform-conditional
# dependency, because the API drives the async engine and would fail at runtime
# with MissingGreenlet on any platform where that condition does not hold.
db = [
    "SQLAlchemy==2.0.51",
    "greenlet==3.5.4",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
fc-verifier = "verifier.cli:main"

[tool.ruff]
# Pinned explicitly rather than left to the installed ruff's defaults, which have widened
# between releases: an unpinned `select` means a new ruff version fails CI on rules nobody
# chose. Raising this list is a deliberate change with its own diff.
target-version = "py311"
line-length = 100
extend-exclude = [
    ".elan",
    ".lake",
    ".venv",
    ".work",
    "lean",
    "vendor",
]

[tool.ruff.lint]
# Ruff's documented core: pycodestyle errors that are almost always bugs, plus pyflakes.
# Deliberately not the wider UP/I/TRY families -- the codebase predates them by ~200
# findings, and a gate that starts red is a gate nobody trusts. Widen it in its own PR.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules add the repository root to `sys.path` before importing from it, because they
# run as scripts rather than as installed modules. The imports genuinely cannot precede that,
# so E402 is describing the design rather than a mistake.
"scripts/*.py" = ["E402"]
"tests/test_taostats.py" = ["E402"]
# The tail of models.py imports `autoreview_models` for its side effect of registering those
# tables on `Base.metadata`, and it has to run after `Base` exists. The comment at that import
# explains why deleting it fails a test.
"conjectures_subnet/db/models.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires the pinned Lean toolchain and trusted cache",
    "subnet_integration: requires the pinned local Subtensor chain",
]

[tool.hatch.build.targets.wheel]
packages = [
    "verifier",
    "conjectures_subnet",
    "submission_api",
    "payout_notifier",
    "payout_watcher",
]
